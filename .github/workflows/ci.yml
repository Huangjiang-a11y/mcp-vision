name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # 测试要真的解码音频，ffmpeg 必须在场
      - name: 装 ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: 装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 只装 numpy 时，OCR / 转写 / 下载 三条能力都该优雅缺席，
      # 但模块本身必须能 import（模型是懒加载的）
      - name: 模块可导入
        run: |
          python -c "import engine, audiochart, mcp_server; print('imports OK')"
          python -c "import ocr; print('ocr module OK')"

      - name: tools/list 冒烟
        run: |
          printf '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}\n{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}\n' \
            | python mcp_server.py | tail -1 | python -c "
          import sys, json
          d = json.load(sys.stdin)
          names = [t['name'] for t in d['result']['tools']]
          assert names == ['workspace', 'video', 'audio', 'subtitles'], names
          print('tools:', names)
          "

      - name: 回归测试（不需要模型和素材）
        run: |
          sh check.sh --test
